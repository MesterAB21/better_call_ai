services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: better_call_ai_app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - NEXT_PUBLIC_API_URL=http://host.docker.internal:8000